<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>云杉银行 · 理财限时抢购</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">杉</span>云杉银行 <small>Spruce Bank</small></div>
    <nav><a href="#">首页</a><a href="#" class="on">理财</a><a href="#">基金</a><a href="#">我的</a></nav>
  </header>

  <section class="hero">
    <h1>周年庆 · 理财限时抢购</h1>
    <p>精选稳健产品，限量发售，先到先得</p>
    <div class="countdown" id="countdown">距离本场结束 <b id="cd">--:--:--</b></div>
  </section>

  <main class="list" id="list"></main>

  <section class="rules">
    <h2>活动规则</h2>
    <ol>
      <li>每位用户每款产品限购一份。</li>
      <li>库存售完即止，未抢到的用户可预约下一场。</li>
      <li>预期年化收益率不代表实际收益，理财有风险，投资需谨慎。</li>
    </ol>
  </section>

  <footer>本页面为课堂演示用的虚构网站，“云杉银行”及所有产品均不存在，不涉及任何真实交易。</footer>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
